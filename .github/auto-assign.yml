name: "Auto Assign Reviewers"

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  add-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Automatically Assign Reviewers
        uses: kentaro-m/auto-assign-action@v2.0.1
        with:
          configuration-path: ".github/auto_assign.yml"
